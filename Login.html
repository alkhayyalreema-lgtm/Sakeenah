<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="style.css">
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Login | Sakeenah </title>
</head>

<body>

    <nav class="navbar">
        <a class="nav-link" href="index.html">Home</a>
        <a class="nav-link" href="login.html">Login</a>
        <a class="nav-link" href="signup.html">Sign Up</a>
        <a class="nav-link" href="about.html">About Us</a>
        <a class="nav-link" href="index.html#adhkar">Daily Adhkar</a>
    </nav>

    <div class="form-container">

        <a href="about.html">
            <img src="images/logo.png"
                 alt="Sakeenah Logo"
                 width="150"
                 height="180">
        </a>

        <h1 style="font-size: 30px;">Welcome Back to Sakeenah</h1>
        <p>Find Peace Through Remembrance</p>

        <form id="loginForm" onsubmit="return validateLogin()">
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required />

            <br /><br />

            <label for="password">Password:</label>
            <input type="password" id="password" name="password" required />

            <br /> <br />

            <button type="submit" class="form-button">Login</button>

            <p id="loginMessage" aria-live="polite"></p>
        </form>

        <p>
            Don't have an account?
            <a href="Signup.html">Sign Up</a>
        </p>

        <script src="auth.js"></script>
    </div>
</body>
</html>
